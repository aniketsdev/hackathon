services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.production
    restart: unless-stopped
    expose:
      - "3000"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.production
    environment:
      GITHUB_OPERATION_STORE: memory
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped
